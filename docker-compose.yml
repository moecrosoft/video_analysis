services:
  backend:
    build: ./backend
    ports:
      - '8000:8000'
    environment:
      - POSTGRES_DB=video
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Postgresmps10
      - POSTGRES_HOST=db
    depends_on:
      - db
      - ollama
    
  frontend:
    build: ./frontend
    ports:
      - '8501:8501'
    depends_on:
      - backend

  db:
    image: postgres:15
    environment: 
      - POSTGRES_DB=video
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Postgresmps10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama
    ports:
      - '11434:11434'
    volumes: 
      - ollama_data:/root/.ollama

  ollama-init:
    image: ollama/ollama
    depends_on:
      - ollama
    entrypoint: >
      /bin/sh -c "
        sleep 5 &&
        ollama pull llama3
      "
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data: